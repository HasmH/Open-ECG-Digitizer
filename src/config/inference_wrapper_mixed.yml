# General-purpose config for a folder containing mixed layouts (12x1, 3x4, 6x2, ...).
# Deliberately simple: the default signal extractor (no layout-specific banding,
# which only makes sense for single-column 12x1) plus a high resample_size so the
# segmentation network sees fine deflections at full resolution. Runs on CPU.
MODEL:
  class_path: 'src.model.inference_wrapper.InferenceWrapper'
  KWARGS:
    config:
      SIGNAL_EXTRACTOR:
        class_path: 'src.model.signal_extractor.SignalExtractor'
        KWARGS: {}   # defaults — the settings the paper used across all layouts

      PERSPECTIVE_DETECTOR:
        class_path: 'src.model.perspective_detector.PerspectiveDetector'
        KWARGS:
          num_thetas: 250
          max_num_nonzero: 250000

      DEWARPER:
        class_path: 'src.model.dewarper.Dewarper'
        KWARGS:
          abs_peak_threshold: 0.1

      SEGMENTATION_MODEL:
        class_path: 'src.model.unet.UNet'
        weight_path: './weights/unet_weights_07072025.pt'
        KWARGS:
          num_in_channels: 3
          num_out_channels: 4
          dims: [32, 64, 128, 256, 320, 320, 320, 320]
          depth: 2

      CROPPER:
        class_path: 'src.model.cropper.Cropper'
        KWARGS:
          granularity: 80
          percentiles: [0.02, 0.98]
          alpha: 0.85
          # Small vertical margin so tall/edge-lead deflections (e.g. V6 S-waves)
          # are not cropped out. Cheap insurance; set to 0.0 to disable.
          vertical_padding_fraction: 0.05

      PIXEL_SIZE_FINDER:
        class_path: 'src.model.pixel_size_finder.PixelSizeFinder'
        KWARGS:
          min_number_of_grid_lines: 30
          max_number_of_grid_lines: 70
          lower_grid_line_factor: 0.3

      LAYOUT_IDENTIFIER:
        class_path: 'src.model.lead_identifier.LeadIdentifier'
        # Covers 12x1 (standard/cabrera), 3x4 (+ rhythm variants), 6x2, 6x1, 3x1.
        config_path: 'src/config/lead_layouts_all.yml'
        unet_config_path: 'src/config/lead_name_unet.yml'
        unet_weight_path: './weights/lead_name_unet_weights_07072025.pt'
        KWARGS:
          debug: false
          device: 'cpu'
          possibly_flipped: false

    device: 'cpu'
    # Whole-page pass stays at native (~3500) so it fits comfortably in RAM.
    resample_size: 3500

    # Edge re-segmentation: re-run the U-Net at higher resolution on horizontal
    # regions and splice the sharper signal probability back in. Memory-safe
    # (tiled), so it gives a true ~2x where it matters without OOMing like a
    # global 2x. Set edge_resegment_scale to None to disable.
    #   edge_resegment_fraction: portion of height from top AND bottom to redo.
    #     ~0.15 = border leads only (cheap); >= 0.5 = whole image / all leads.
    edge_resegment_scale: 2.0
    edge_resegment_fraction: 0.15
    edge_resegment_max_tile_px: 6000000

    rotate_on_resample: true
    enable_timing: false
    apply_dewarping: false

DATA:
  images_path: '/Users/hasam/Desktop/data/images/1'   # <-- point at your mixed-layout folder
  image_extensions: ['.png', '.jpg', '.jpeg', '.JPG']
  output_path: 'sandbox/inference_output_mixed'
  save_mode: 'all'                # 'all' = PNG + CSV; use 'timeseries_only' for CSV-only over large batches
  layout_should_include_substring: null   # no filename-based layout restriction
