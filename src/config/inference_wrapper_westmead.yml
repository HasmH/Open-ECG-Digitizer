MODEL:
  class_path: 'src.model.inference_wrapper.InferenceWrapper'
  KWARGS:
    config:
      SIGNAL_EXTRACTOR:
        class_path: 'src.model.signal_extractor.SignalExtractor'
        KWARGS:
          # Twelve stacked traces can be close together, so preserve short
          # valid runs while the extractor resolves overlaps iteratively.
          min_line_width: 20
          max_iterations: 6

      PERSPECTIVE_DETECTOR:
        class_path: 'src.model.perspective_detector.PerspectiveDetector'
        KWARGS:
          num_thetas: 250

      DEWARPER:
        class_path: 'src.model.dewarper.Dewarper'
        KWARGS:
          abs_peak_threshold: 0.1

      SEGMENTATION_MODEL:
        class_path: 'src.model.unet.UNet'
        weight_path: './weights/unet_weights_07072025.pt'
        KWARGS:
          num_in_channels: 3
          num_out_channels: 4
          dims: [32, 64, 128, 256, 320, 320, 320, 320]
          depth: 2

      CROPPER:
        class_path: 'src.model.cropper.Cropper'
        KWARGS:
          granularity: 120
          # Keep tall waveform excursions outside the printed grid. A small
          # guard remains to prevent isolated segmentation noise defining the crop.
          percentiles: [0.001, 0.999]
          # Retain a 4% guard band above lead I and below V6 at both crop stages.
          vertical_padding_fraction: 0.04
          alpha: 0.95

      PIXEL_SIZE_FINDER:
        class_path: 'src.model.pixel_size_finder.PixelSizeFinder'
        KWARGS:
          min_number_of_grid_lines: 30
          max_number_of_grid_lines: 70
          lower_grid_line_factor: 0.3

      LAYOUT_IDENTIFIER:
        class_path: 'src.model.lead_identifier.LeadIdentifier'
        config_path: 'src/config/lead_layouts_westmead_12x1.yml'
        unet_config_path: 'src/config/lead_name_unet.yml'
        unet_weight_path: './weights/lead_name_unet_weights_07072025.pt'
        KWARGS:
          debug: false
          device: 'cpu'
          possibly_flipped: false
          target_num_samples: 5000
          required_valid_samples: 6

    device: 'cpu'
    resample_size: 5000
    rotate_on_resample: true
    enable_timing: false
    apply_dewarping: false

DATA:
  images_path: '/Users/hasam/Desktop/data/images/1'
  image_extensions: ['.png']
  output_path: 'sandbox/vertical_padding_test'
  save_mode: 'all'
  layout_should_include_substring: null
