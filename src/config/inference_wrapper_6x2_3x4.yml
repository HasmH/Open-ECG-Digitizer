# Config for standard MULTI-COLUMN layouts (3x4 and 6x2) in one folder.
#
# Deliberately NO banding: num_bands is single-column (12x1) only -- on a 3x4/6x2
# it would merge the side-by-side leads in a row. This uses the normal/default
# extractor and the paper's standard multi-column settings, so it is a clean
# baseline you can trust for "did anything regress?".
#
# Edge re-segmentation is included (2x on the top/bottom strips) to recover faint
# border-lead signal; it is layout-agnostic and memory-safe (tiled). To get the
# plain pipeline for an exact regression comparison, set edge_resegment_scale to
# null (or override on the command line: MODEL.KWARGS.edge_resegment_scale=null).
MODEL:
  class_path: 'src.model.inference_wrapper.InferenceWrapper'
  KWARGS:
    config:
      SIGNAL_EXTRACTOR:
        class_path: 'src.model.signal_extractor.SignalExtractor'
        KWARGS: {}   # default settings, no banding -- normal, as the paper uses for standard layouts

      PERSPECTIVE_DETECTOR:
        class_path: 'src.model.perspective_detector.PerspectiveDetector'
        KWARGS:
          num_thetas: 250

      DEWARPER:
        class_path: 'src.model.dewarper.Dewarper'
        KWARGS:
          abs_peak_threshold: 0.1

      SEGMENTATION_MODEL:
        class_path: 'src.model.unet.UNet'
        weight_path: './weights/unet_weights_07072025.pt'
        KWARGS:
          num_in_channels: 3
          num_out_channels: 4
          dims: [32, 64, 128, 256, 320, 320, 320, 320]
          depth: 2

      CROPPER:
        class_path: 'src.model.cropper.Cropper'
        KWARGS:
          granularity: 80
          percentiles: [0.02, 0.98]
          alpha: 0.85

      PIXEL_SIZE_FINDER:
        class_path: 'src.model.pixel_size_finder.PixelSizeFinder'
        KWARGS:
          min_number_of_grid_lines: 30
          max_number_of_grid_lines: 70
          lower_grid_line_factor: 0.5

      LAYOUT_IDENTIFIER:
        class_path: 'src.model.lead_identifier.LeadIdentifier'
        # Includes standard_3x4 (+ rhythm-strip variants) and standard_6x2.
        config_path: 'src/config/lead_layouts_all.yml'
        unet_config_path: 'src/config/lead_name_unet.yml'
        unet_weight_path: './weights/lead_name_unet_weights_07072025.pt'
        KWARGS:
          debug: false
          device: 'cpu'
          possibly_flipped: false
          # ~ expected rows / 2; 2 suits both 3-row (3x4) and 6-row (6x2) layouts.
          required_valid_samples: 2

    device: 'cpu'
    resample_size: 3000
    # 3x4 / 6x2 are LANDSCAPE layouts (leads run horizontally), so never rotate.
    # rotate_on_resample rotates any crop that is taller-than-wide -- correct for
    # tall single-column 12x1, but it flips a 3x4/6x2 on a portrait-scanned page
    # 90 degrees and drags the header in. Keep it false for these layouts.
    rotate_on_resample: false
    enable_timing: false
    apply_dewarping: false

    # Edge re-segmentation: 2x re-run on the top/bottom strips, spliced back in.
    # Recovers faint border-lead signal; memory-safe. Set to null to disable.
    edge_resegment_scale: 2.0
    edge_resegment_fraction: 0.15
    edge_resegment_max_tile_px: 6000000

DATA:
  images_path: '/Users/hasam/Desktop/data/images/3'
  image_extensions: ['.png', '.jpg', '.jpeg', '.JPG']
  output_path: 'sandbox/final2'
  save_mode: 'all'
  layout_should_include_substring: null   # no filename-based layout restriction
